[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "totannstudio"
version = "0.1.0"
description = "Self-hosted web studio for building and training neural networks with tota"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Tomasz Tota"}]
dependencies = ["tota>=1.0.1,<2"]
keywords = ["neural-networks", "self-hosted", "machine-learning", "tota"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]

[project.scripts]
totannstudio = "totannstudio.server:main"

[tool.setuptools.packages.find]
include = ["totannstudio*"]

[tool.setuptools.package-data]
totannstudio = ["web/*", "marketing/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
