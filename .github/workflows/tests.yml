name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install .
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q totannstudio main.py
      - name: Check JavaScript
        run: |
          node --check totannstudio/web/app.js
          node --check totannstudio/marketing/script.js
      - name: Build and inspect wheel
        run: |
          python -m pip install build
          python -m build --wheel
          python -m zipfile -l dist/totannstudio-*.whl | grep 'totannstudio/web/index.html'
          python -m zipfile -l dist/totannstudio-*.whl | grep 'totannstudio/marketing/index.html'
